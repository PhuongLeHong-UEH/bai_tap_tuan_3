<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 10 - Exercise 10.5</title>
    <link rel="stylesheet" href="../css/lab10.css">
    <link rel="stylesheet" href="../../css/lab-nav.css">
    <style>
        body { font-family: Arial, Helvetica, sans-serif; padding: 20px; }
        #controls button { margin: 0 4px 6px 0; padding: 6px 10px; }
        #info { margin: 10px 0 20px; font-weight: bold; color: #00675a; }
        img.inserted { border: 3px solid #f58220; margin: 4px; }
    </style>
    <!-- Exercise 10.1: nạp jQuery từ CDN (dùng https vì GitHub Pages chạy trên https) -->
    <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
    <!-- Nếu CDN không dùng được (mất mạng...) thì nạp bản dự phòng nằm trong repository -->
    <script type="text/javascript">
        window.jQuery || document.write('<script src="../js/jquery-3.1.1.min.js"><\/script>');
    </script>
</head>
<body>
<a class="lab-back" href="../index.html">&larr; Lab 10</a>
<div class="lab-tag"><b>Lab 10</b> &bull; Exercise 10.5 &ndash; Inserting DOM elements</div>

<h2>Chèn phần tử DOM bằng jQuery</h2>
<p>Bấm từng nút để xem cách chèn ảnh (viền cam) so với khung xám .panel. Khi tải trang, ảnh được chèn bằng <code>after()</code> như bước 2.</p>
<div id="controls">
    <button data-method="after">after</button>
    <button data-method="before">before</button>
    <button data-method="append">append</button>
    <button data-method="prepend">prepend</button>
    <button data-method="appendTo">appendTo</button>
    <button data-method="prependTo">prependTo</button>
    <button data-method="insertBefore">insertBefore</button>
</div>
<div id="info"></div>

<div class="panel">
    <p>existing content</p>
</div>

<script type="text/javascript" language="javascript" src="script.js"></script>
</body>
</html>
