<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bài tập 8b - The Bat family</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Times New Roman", serif; margin: 0; padding: 20px; }
    .back { font-family: Arial, sans-serif; color: #00675a; text-decoration: none; font-weight: bold; }

    /* i. Khung chứa lớn */
    .container { width: 1024px; margin: 20px auto; text-align: center; }

    /* ii. site-header */
    .site-header {
      margin: 0 0 30px;
      padding: 12px 0;
      background-color: #ccc;
      text-align: center;
    }
    .site-header h1 {
      margin: 0;
      font-size: 26px;
      color: #fff;
      text-shadow: 2px 2px 3px #333;
    }

    /* iii. li trong superheroes */
    .superheroes { list-style: none; margin: 0; padding: 0; font-size: 0; white-space: nowrap; }
    .superheroes li {
      display: inline-block;
      width: 18%;
      margin: 0 0.5%;
      position: relative;
      vertical-align: top;
      transition: width .3s;
    }

    /* iv. Hình trong superheroes */
    .superheroes img {
      display: block;
      max-width: 100%;
      width: 100%;
      aspect-ratio: 1 / 1.2;
      object-fit: cover;
      border: 2px solid #fff;
      border-radius: 14px;
    }

    /* v. Thẻ a trong superheroes */
    .superheroes a { display: block; width: 100%; color: rgba(255,255,255,.55); text-decoration: none; }
    .superheroes .name {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 7px 4px;
      font-size: 14px; font-weight: bold; text-align: center;
      border-radius: 14px 14px 0 0;
    }

    /* Read more: ẩn mặc định */
    .superheroes .more {
      display: none;
      position: absolute; top: 100%; left: 0;
      margin-top: 4px;
      padding: 6px 0;
      background: #777;
      font-size: 12px; text-align: center; color: #fff;
    }

    /* vi. Hover */
    .superheroes li:hover { width: 22%; }                       /* 2. tăng chiều rộng li */
    .superheroes li:hover .name { background: rgba(0,0,0,.75); color: #fff; }
    .superheroes li:hover .more { display: block; }             /* 1. hiện Read more */
    .superheroes li:hover .more:hover { text-decoration: underline; } /* ...và gạch chân */
  </style>
</head>
<body>
  <a class="back" href="index.html">&larr; Về trang chủ</a>

  <div class="container">
    <header class="site-header"><h1>&#129415; The Bat family</h1></header>

    <ul class="superheroes">
      <li><a href="#"><img src="images/bat1.svg" alt="Batman"><span class="name">Batman</span></a><a class="more" href="#">Read more</a></li>
      <li><a href="#"><img src="images/bat2.svg" alt="Batwing"><span class="name">Batwing</span></a><a class="more" href="#">Read more</a></li>
      <li><a href="#"><img src="images/bat3.svg" alt="Batgirl"><span class="name">Batgirl</span></a><a class="more" href="#">Read more</a></li>
      <li><a href="#"><img src="images/bat4.svg" alt="Nightwing"><span class="name">Nightwing</span></a><a class="more" href="#">Read more</a></li>
      <li><a href="#"><img src="images/bat5.svg" alt="Red Robin"><span class="name">Red Robin</span></a><a class="more" href="#">Read more</a></li>
    </ul>
  </div>
</body>
</html>
