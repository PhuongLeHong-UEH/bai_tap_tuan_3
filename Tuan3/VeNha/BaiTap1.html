<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài tập 1 - Hai game học CSS</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background: #f4f7f6; color: #222; }
    h1 { text-align: center; color: #00675a; }
    h2 { color: #00675a; border-left: 6px solid #f58220; padding-left: 10px; }
    .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    .card img { width: 100%; height: auto; border: 1px solid #ccc; border-radius: 6px; display: block; }
    .back { display: inline-block; margin-bottom: 10px; color: #00675a; text-decoration: none; font-weight: bold; }
    .back:hover { text-decoration: underline; }
    figcaption { margin-top: 8px; font-style: italic; color: #555; text-align: center; }
    figure { margin: 0; }
  </style>
</head>
<body>
  <a class="back" href="index.html">&larr; Về trang chủ</a>
  <h1>Bài tập 1: Hoàn thành 2 game học CSS</h1>

  <div class="card">
    <h2>Game 1: Trò chơi CSS</h2>
    <p>Đường dẫn: <a href="https://flukeout.github.io/" target="_blank" rel="noopener">https://flukeout.github.io/</a></p>
    <figure>
      <img src="images/game1-css-diner.png" alt="Hình chụp hoàn thành Level 32 của game CSS Diner">
      <figcaption>Hoàn thành Level 32/32 - "You did it! You rock at CSS."</figcaption>
    </figure>
  </div>

  <div class="card">
    <h2>Game 2: CSS Speed Run</h2>
    <p>Đường dẫn: <a href="https://css-speedrun.netlify.app/" target="_blank" rel="noopener">https://css-speedrun.netlify.app/</a></p>
    <figure>
      <img src="images/game2-css-speedrun.png" alt="Hình chụp hoàn thành tất cả level của game CSS Speedrun">
      <figcaption>Hoàn thành tất cả các level (Intro - Level 10) - "Congratulations!"</figcaption>
    </figure>
  </div>
</body>
</html>
