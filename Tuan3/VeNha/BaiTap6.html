    body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 20px; }
    .back { color: #00675a; text-decoration: none; font-weight: bold; }

    .portfolio { max-width: 900px; margin: 10px auto; background: #f7f7f7; padding-bottom: 6px; }
    .portfolio h2 {
      text-align: center; font-size: 16px; color: #333; margin: 0; padding: 22px 0 18px;
      position: relative;
    }
    .portfolio h2::after {  /* gạch ngắn dưới tiêu đề */
      content: ""; display: block; width: 40px; height: 2px; background: #2a9d8f; margin: 10px auto 0;
    }

    .list-tab { list-style: none; margin: 0; padding: 0 0 18px; text-align: center; }
    .list-tab li { display: inline-block; margin: 0 8px; }
    .list-tab a { font-size: 11px; font-weight: bold; color: #444; text-decoration: none; }
    .list-tab li:first-child a, .list-tab a:hover { color: #2a9d8f; }

    .galerry { list-style: none; margin: 0; padding: 0; background: #fff; font-size: 0; /* bỏ khe hở inline-block */ }
    .galerry li { display: inline-block; width: 33.333%; padding: 4px; box-sizing: border-box; vertical-align: top; }
    .galerry a { display: block; background: #9ccc7a; aspect-ratio: 350 / 260; }
    .galerry img { display: block; width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
