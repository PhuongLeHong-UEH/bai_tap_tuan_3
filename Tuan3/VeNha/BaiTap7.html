<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài tập 7 - Bố cục trang</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #fff; }
    .back { color: #00675a; text-decoration: none; font-weight: bold; }

    #wrapper {
      width: 300px;
      height: 340px;
      margin: 30px auto;
      border: 3px solid #000;
      padding: 6px;
      box-shadow: 12px 12px 0 #bbb;
      position: relative;
      background: #fff;
    }
    #wrapper::before { content: "wrapper"; position: absolute; top: -24px; left: 0; font-size: 16px; }

    header, nav, main, footer { border: 2px solid #000; padding: 4px 6px; font-size: 16px; }
    header { height: 46px; margin-bottom: 6px; }
    nav { float: left; width: 52px; height: 216px; }
    main { margin-left: 58px; height: 216px; }
    footer { clear: both; height: 34px; margin-top: 6px; }
  </style>
</head>
<body>
  <a class="back" href="index.html">&larr; Về trang chủ</a>
  <div id="wrapper">
    <header>header</header>
    <nav>nav</nav>
    <main>main</main>
    <footer>footer</footer>
  </div>
</body>
</html>
