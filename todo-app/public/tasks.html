<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="css/style.css"></head><body><div class="app">
<aside class="side"><div class="logo"><i>✓</i>TodoApp</div><a class="nav" href="index.html"><span>🏠</span>Hôm nay</a><a class="nav on" href="tasks.html"><span>📋</span>Tất cả công việc</a><a class="nav" href="stats.html"><span>📊</span>Thống kê</a><div class="foot">Node.js · Express · SQLite</div></aside>
<main>
<div class="head"><div><h1>Tất cả công việc</h1><p id="count">Đang tải…</p></div><button class="btn" id="addBtn">＋ Thêm công việc</button></div>
<div class="filters"><input class="search" type="search" id="q" placeholder="🔍 Tìm theo tiêu đề hoặc mô tả…" aria-label="Tìm kiếm">
<select id="sta" aria-label="Trạng thái"><option value="">Mọi trạng thái</option><option value="open">Chưa xong</option><option value="todo">Chưa làm</option><option value="doing">Đang làm</option><option value="done">Hoàn thành</option></select>

<select id="cat" aria-label="Danh mục"></select>
<select id="sort" aria-label="Sắp xếp"><option value="due">Sắp theo hạn</option><option value="priority">Sắp theo ưu tiên</option><option value="newest">Mới thêm trước</option></select></div>
<div id="out"></div></main></div><script src="js/common.js"></script><script src="js/tasks.js"></script></body></html>
